<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Load test: the dependency becomes slow</title><desc id="d">Responses per second by status and the slowest response per second over 60 seconds at 50 requests per second. Between 15 and 35 seconds the dependency takes 3 seconds to answer. Requests are cut at the 2-second timeout, the extra ones are rejected by the semaphore, and the circuit opens.</desc>
