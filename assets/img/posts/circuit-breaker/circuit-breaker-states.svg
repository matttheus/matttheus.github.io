<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" role="img" aria-labelledby="title desc" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">The three states of a circuit breaker</title>
  <desc id="desc">CLOSED: requests flow to the service and failures are counted. When failures reach the threshold, it goes to OPEN: requests fail fast without calling the service. After a timeout, it goes to HALF-OPEN: one test request goes through. If it works, back to CLOSED; if it fails, back to OPEN.</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f87171"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-small-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f87171"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="960" height="660" rx="22" fill="#181818"/>
  <rect x="0.5" y="0.5" width="959" height="659" rx="22" fill="none" stroke="#2b2b2b"/>

  <!-- heading -->
  <text x="40" y="52" font-size="24" font-weight="700" fill="#e7e7e7">How a circuit breaker works</text>
  <text x="40" y="78" font-size="15" fill="#9d9d9d">A little switch between your app and a service, just like the breaker in your house.</text>

  <!-- ===================== transitions ===================== -->

  <!-- CLOSED -> OPEN -->
  <path d="M 352 214 L 606 214" stroke="#f87171" stroke-width="3" fill="none" marker-end="url(#arrow-red)"/>
  <g transform="translate(383 196)">
    <rect x="0" y="0" width="192" height="36" rx="18" fill="#2a1d1d" stroke="#f87171" stroke-opacity="0.6"/>
    <path d="M27 7 L18 20 L24 20 L21 29 L31 15 L25 15 L28 7 z" fill="#fca5a5"/>
    <text x="40" y="23" font-size="14" font-weight="600" fill="#fca5a5">too many failures</text>
  </g>

  <!-- OPEN -> HALF-OPEN (timeout) -->
  <path d="M 680 344 C 680 400, 676 430, 646 446" stroke="#fbbf24" stroke-width="3" fill="none" marker-end="url(#arrow-amber)"/>
  <g transform="translate(698 376)">
    <rect x="0" y="0" width="150" height="36" rx="18" fill="#2a2416" stroke="#fbbf24" stroke-opacity="0.6"/>
    <circle cx="22" cy="18" r="9" fill="none" stroke="#fcd34d" stroke-width="2"/>
    <path d="M22 12 L22 18 L27 21" stroke="#fcd34d" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="40" y="23" font-size="14" font-weight="600" fill="#fcd34d">timeout passes</text>
  </g>

  <!-- HALF-OPEN -> OPEN (test fails) -->
  <path d="M 646 566 C 860 566, 880 470, 866 348" stroke="#f87171" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#arrow-red)"/>
  <g transform="translate(772 486)">
    <rect x="0" y="0" width="142" height="36" rx="18" fill="#2a1d1d" stroke="#f87171" stroke-opacity="0.6"/>
    <path d="M17 12 L29 24 M29 12 L17 24" stroke="#fca5a5" stroke-width="2.6" stroke-linecap="round"/>
    <text x="40" y="23" font-size="14" font-weight="600" fill="#fca5a5">test fails</text>
  </g>

  <!-- HALF-OPEN -> CLOSED (test works) -->
  <path d="M 314 506 C 140 506, 118 430, 128 348" stroke="#34d399" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>
  <g transform="translate(52 414)">
    <rect x="0" y="0" width="148" height="36" rx="18" fill="#16271f" stroke="#34d399" stroke-opacity="0.6"/>
    <path d="M16 18 L22 24 L32 12" stroke="#6ee7b7" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="42" y="23" font-size="14" font-weight="600" fill="#6ee7b7">test works</text>
  </g>

  <!-- ===================== CLOSED ===================== -->
  <g transform="translate(40 104)" filter="url(#shadow)">
    <rect x="0" y="0" width="304" height="232" rx="18" fill="#232323" stroke="#34d399" stroke-opacity="0.55" stroke-width="1.5"/>
    <circle cx="26" cy="32" r="7" fill="#34d399" filter="url(#glow)"/>
    <text x="42" y="38" font-size="19" font-weight="800" fill="#34d399" letter-spacing="0.5">CLOSED</text>
    <rect x="200" y="17" width="84" height="26" rx="13" fill="#16271f"/>
    <text x="242" y="35" font-size="12.5" font-weight="600" fill="#6ee7b7" text-anchor="middle">all good</text>

    <!-- app -->
    <rect x="18" y="84" width="60" height="46" rx="11" fill="#2e2e2e" stroke="#3d3d3d"/>
    <text x="48" y="112" font-size="14" font-weight="600" fill="#d4d4d4" text-anchor="middle">app</text>
    <!-- wires (powered) -->
    <line x1="78" y1="107" x2="126" y2="107" stroke="#34d399" stroke-width="3" filter="url(#glow)"/>
    <line x1="174" y1="107" x2="222" y2="107" stroke="#34d399" stroke-width="3" filter="url(#glow)"/>
    <!-- switch: lever down, connected -->
    <line x1="128" y1="107" x2="172" y2="107" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
    <circle cx="128" cy="107" r="6" fill="#232323" stroke="#34d399" stroke-width="2.5"/>
    <circle cx="172" cy="107" r="6" fill="#232323" stroke="#34d399" stroke-width="2.5"/>
    <!-- requests flowing -->
    <circle cx="92" cy="107" r="4.5" fill="#a7f3d0"/>
    <circle cx="111" cy="107" r="4.5" fill="#a7f3d0"/>
    <circle cx="190" cy="107" r="4.5" fill="#a7f3d0"/>
    <circle cx="208" cy="107" r="4.5" fill="#a7f3d0"/>
    <!-- service: happy -->
    <rect x="222" y="78" width="62" height="58" rx="14" fill="#2e2e2e" stroke="#34d399" stroke-opacity="0.7" stroke-width="1.5"/>
    <circle cx="242" cy="101" r="3.5" fill="#e7e7e7"/>
    <circle cx="264" cy="101" r="3.5" fill="#e7e7e7"/>
    <path d="M241 114 Q253 125 265 114" stroke="#e7e7e7" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="253" y="154" font-size="12" fill="#9d9d9d" text-anchor="middle">service</text>
    <!-- failure counter -->
    <g transform="translate(96 132)">
      <rect x="0" y="0" width="108" height="26" rx="13" fill="#1c1c1c" stroke="#3d3d3d"/>
      <text x="12" y="17.5" font-size="12" fill="#9d9d9d">failures</text>
      <text x="96" y="17.5" font-size="12" font-weight="700" fill="#e7e7e7" text-anchor="end">2 / 10</text>
    </g>

    <text x="18" y="186" font-size="14.5" fill="#cccccc">Requests flow to the service.</text>
    <text x="18" y="208" font-size="14.5" fill="#cccccc">Failures are <tspan font-weight="700" fill="#e7e7e7">counted</tspan>.</text>
  </g>

  <!-- ===================== OPEN ===================== -->
  <g transform="translate(616 104)" filter="url(#shadow)">
    <rect x="0" y="0" width="304" height="232" rx="18" fill="#232323" stroke="#f87171" stroke-opacity="0.55" stroke-width="1.5"/>
    <circle cx="26" cy="32" r="7" fill="#f87171" filter="url(#glow)"/>
    <text x="42" y="38" font-size="19" font-weight="800" fill="#f87171" letter-spacing="0.5">OPEN</text>
    <rect x="188" y="17" width="96" height="26" rx="13" fill="#2a1d1d"/>
    <text x="236" y="35" font-size="12.5" font-weight="600" fill="#fca5a5" text-anchor="middle">protecting</text>

    <!-- app -->
    <rect x="18" y="84" width="60" height="46" rx="11" fill="#2e2e2e" stroke="#3d3d3d"/>
    <text x="48" y="112" font-size="14" font-weight="600" fill="#d4d4d4" text-anchor="middle">app</text>
    <!-- wires (off) -->
    <line x1="78" y1="107" x2="126" y2="107" stroke="#5a5a5a" stroke-width="3"/>
    <line x1="174" y1="107" x2="222" y2="107" stroke="#4a4a4a" stroke-width="3" stroke-dasharray="5 5"/>
    <!-- switch: lever up, disconnected -->
    <line x1="128" y1="107" x2="160" y2="75" stroke="#f87171" stroke-width="6" stroke-linecap="round"/>
    <circle cx="128" cy="107" r="6" fill="#232323" stroke="#f87171" stroke-width="2.5"/>
    <circle cx="172" cy="107" r="6" fill="#232323" stroke="#5a5a5a" stroke-width="2.5"/>
    <!-- requests bouncing back -->
    <circle cx="112" cy="107" r="4.5" fill="#fca5a5"/>
    <path d="M110 94 Q96 72 80 88" stroke="#f87171" stroke-width="2" fill="none" marker-end="url(#arrow-small-red)"/>
    <text x="95" y="68" font-size="12" font-weight="700" fill="#fca5a5" text-anchor="middle">fail fast</text>
    <!-- service: dizzy -->
    <rect x="222" y="78" width="62" height="58" rx="14" fill="#2e2e2e" stroke="#f87171" stroke-opacity="0.7" stroke-width="1.5"/>
    <path d="M238 97 L246 105 M246 97 L238 105" stroke="#e7e7e7" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M260 97 L268 105 M268 97 L260 105" stroke="#e7e7e7" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M242 121 Q247 116 253 121 Q259 126 264 121" stroke="#e7e7e7" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="253" y="154" font-size="12" fill="#9d9d9d" text-anchor="middle">service</text>

    <text x="18" y="186" font-size="14.5" fill="#cccccc">Requests <tspan font-weight="700" fill="#e7e7e7">fail fast</tspan>, without</text>
    <text x="18" y="208" font-size="14.5" fill="#cccccc">even calling the service.</text>
  </g>

  <!-- ===================== HALF-OPEN ===================== -->
  <g transform="translate(328 410)" filter="url(#shadow)">
    <rect x="0" y="0" width="304" height="232" rx="18" fill="#232323" stroke="#fbbf24" stroke-opacity="0.55" stroke-width="1.5"/>
    <circle cx="26" cy="32" r="7" fill="#fbbf24" filter="url(#glow)"/>
    <text x="42" y="38" font-size="19" font-weight="800" fill="#fbbf24" letter-spacing="0.5">HALF-OPEN</text>
    <rect x="200" y="17" width="84" height="26" rx="13" fill="#2a2416"/>
    <text x="242" y="35" font-size="12.5" font-weight="600" fill="#fcd34d" text-anchor="middle">testing</text>

    <!-- app -->
    <rect x="18" y="84" width="60" height="46" rx="11" fill="#2e2e2e" stroke="#3d3d3d"/>
    <text x="48" y="112" font-size="14" font-weight="600" fill="#d4d4d4" text-anchor="middle">app</text>
    <!-- wires (one request allowed) -->
    <line x1="78" y1="107" x2="126" y2="107" stroke="#fbbf24" stroke-opacity="0.6" stroke-width="3"/>
    <line x1="174" y1="107" x2="222" y2="107" stroke="#fbbf24" stroke-opacity="0.6" stroke-width="3" stroke-dasharray="5 5"/>
    <!-- switch: lever half way -->
    <line x1="128" y1="107" x2="168" y2="89" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
    <circle cx="128" cy="107" r="6" fill="#232323" stroke="#fbbf24" stroke-width="2.5"/>
    <circle cx="172" cy="107" r="6" fill="#232323" stroke="#fbbf24" stroke-width="2.5"/>
    <!-- one test request -->
    <circle cx="198" cy="107" r="5.5" fill="#fde68a" filter="url(#glow)"/>
    <rect x="183" y="64" width="30" height="24" rx="8" fill="#2a2416" stroke="#fbbf24" stroke-opacity="0.8"/>
    <text x="198" y="81" font-size="15" font-weight="800" fill="#fcd34d" text-anchor="middle">?</text>
    <path d="M198 88 L198 98" stroke="#fbbf24" stroke-opacity="0.8" stroke-width="1.5"/>
    <!-- service: curious -->
    <rect x="222" y="78" width="62" height="58" rx="14" fill="#2e2e2e" stroke="#fbbf24" stroke-opacity="0.7" stroke-width="1.5"/>
    <circle cx="242" cy="101" r="3.5" fill="#e7e7e7"/>
    <circle cx="264" cy="101" r="3.5" fill="#e7e7e7"/>
    <path d="M243 118 L263 118" stroke="#e7e7e7" stroke-width="2.5" stroke-linecap="round"/>
    <text x="253" y="154" font-size="12" fill="#9d9d9d" text-anchor="middle">service</text>

    <text x="18" y="186" font-size="14.5" fill="#cccccc">Only <tspan font-weight="700" fill="#e7e7e7">one test request</tspan> goes</text>
    <text x="18" y="208" font-size="14.5" fill="#cccccc">through to check if it's back.</text>
  </g>
</svg>
