<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Load test: the dependency goes down for 20 seconds</title><desc id="d">Responses per second by status and p95 latency over 60 seconds at 50 requests per second. The dependency fails between 15 and 35 seconds. The circuit opens after about 5 seconds, turning slow 502 errors into 503 responses in about 1 ms, and closes after the dependency recovers.</desc>
