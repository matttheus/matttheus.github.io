<title id="t">Load test: traffic spike to a healthy dependency</title><desc id="d">Responses per second by status over 40 seconds while traffic ramps from 20 to 300 requests per second. Around 130 requests per second are served (13 slots at 100 ms each); the rest are rejected in under 1 ms. The circuit stays closed the whole time.</desc>
